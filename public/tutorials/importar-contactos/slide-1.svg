<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#E8B923"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="1280" height="720" fill="#0A0A0F"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="720" fill="#12121A"/>
  <line x1="220" y1="0" x2="220" y2="720" stroke="#2A2A4A" stroke-width="1"/>
  <rect x="20" y="24" width="40" height="40" rx="8" fill="url(#goldGrad)"/>
  <text x="72" y="44" fill="#C9A84C" font-size="18" font-weight="800">RAI</text>
  <text x="72" y="60" fill="#8888AA" font-size="9" letter-spacing="1">AGENCY CRM</text>
  <line x1="20" y1="86" x2="200" y2="86" stroke="#2A2A4A" stroke-width="1"/>
  <text x="28" y="116" fill="#8888AA" font-family="Inter, Arial, sans-serif" font-size="13">Dashboard</text>
    <text x="28" y="158" fill="#8888AA" font-family="Inter, Arial, sans-serif" font-size="13">Guía de Inicio</text>
    <text x="28" y="200" fill="#8888AA" font-family="Inter, Arial, sans-serif" font-size="13">Nueva Campaña</text>
    <rect x="12" y="218" width="196" height="34" rx="8" fill="rgba(201,168,76,0.12)" stroke="#C9A84C" stroke-width="1"/>
    <text x="28" y="242" fill="#C9A84C" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Conversaciones</text>
    <text x="28" y="284" fill="#8888AA" font-family="Inter, Arial, sans-serif" font-size="13">Marketing</text>
    <text x="28" y="326" fill="#8888AA" font-family="Inter, Arial, sans-serif" font-size="13">Facturación</text>
    <text x="28" y="368" fill="#8888AA" font-family="Inter, Arial, sans-serif" font-size="13">Claves de IA</text>
    <text x="28" y="410" fill="#8888AA" font-family="Inter, Arial, sans-serif" font-size="13">Configuración</text>

  <!-- topbar -->
  <rect x="220" y="0" width="1060" height="64" fill="#0A0A0F"/>
  <line x1="220" y1="64" x2="1280" y2="64" stroke="#2A2A4A" stroke-width="1"/>
  <text x="250" y="40" fill="#F5F5F5" font-size="20" font-weight="700">Importa tus contactos existentes</text>
  <rect x="1100" y="20" width="140" height="28" rx="14" fill="rgba(201,168,76,0.15)"/>
  <text x="1170" y="39" fill="#C9A84C" font-size="12" text-anchor="middle">Paso 1 de 2</text>

  <!-- card principal -->
  <rect x="250" y="96" width="1000" height="590" rx="16" fill="#1A1A2E" stroke="#2A2A4A" stroke-width="1"/>
  <text x="290" y="160" fill="#F5F5F5" font-size="26" font-weight="700">Importa tus contactos</text>
  <text x="290" y="200" fill="#8888AA" font-size="15">
    <tspan x="290" dy="0">Usa el botón Importar para subir</tspan><tspan x="290" dy="26">un archivo CSV con tus contactos.</tspan>
  </text>

  <!-- botón / acción resaltada -->
  <rect x="290" y="320" width="320" height="56" rx="10" fill="url(#goldGrad)"/>
  <text x="450" y="355" fill="#0A0A0F" font-size="15" font-weight="700" text-anchor="middle">Importar contactos</text>
  <text x="630" y="355" fill="#E8B923" font-size="14" font-style="italic">&#8592; haz clic aqu&#237;</text>

  <!-- elementos decorativos vacios -->
  <rect x="290" y="470" width="920" height="40" rx="8" fill="none" stroke="#2A2A4A" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="290" y="526" width="920" height="40" rx="8" fill="none" stroke="#2A2A4A" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="290" y="582" width="920" height="40" rx="8" fill="none" stroke="#2A2A4A" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
