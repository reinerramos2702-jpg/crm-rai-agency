name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          head -c 100000 diff.txt > diff_trimmed.txt

      - name: Review diff with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          diff_text = open("diff_trimmed.txt", "r", encoding="utf-8", errors="ignore").read()

          prompt = (
              "Revisa este diff de Pull Request del proyecto CRM RAI Agency "
              "(Next.js, Prisma, Supabase). Sigue las buenas practicas del repo: "
              "sin secretos hardcodeados, RBAC correcto, rutas API con export const dynamic "
              "cuando corresponda, sin codigo muerto. Reporta bugs, riesgos de seguridad "
              "y calidad general. Si algo es bloqueante, empieza tu respuesta con BLOQUEANTE: "
              "y explica por que. Si esta todo limpio, empieza con APROBADO - codigo limpio "
              "y optimo. Nunca digas que aprobaste el merge, solo evalua el codigo.\n\n"
              "DIFF:\n" + diff_text
          )

          key = os.environ["GEMINI_API_KEY"]
          model = "gemini-2.5-flash"
          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              + model + ":generateContent?key=" + key
          )
          payload = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}]
          }).encode("utf-8")
          req = urllib.request.Request(
              url, data=payload, headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="ignore")
              print("GEMINI_HTTP_ERROR", e.code, body)
              with open("review.md", "w", encoding="utf-8") as f:
                  f.write(
                      "No se pudo completar la revision automatica con Gemini "
                      "(HTTP " + str(e.code) + "). Detalle tecnico en los logs "
                      "del workflow de GitHub Actions.\n\n" + body[:1500]
                  )
              sys.exit(0)

          text = result["candidates"][0]["content"]["parts"][0]["text"]
          with open("review.md", "w", encoding="utf-8") as f:
              f.write(text)
          PYEOF

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
