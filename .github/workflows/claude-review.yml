name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa el diff de este Pull Request contra main siguiendo BUENAS-PRACTICAS-CLAUDE-CODE.md del repo:
            - Bugs y errores de logica
            - Vulnerabilidades de seguridad (secretos hardcodeados, inyeccion, auth)
            - Cumplimiento de buenas practicas del proyecto (RBAC, roles, .env, Prisma)
            - Calidad general de codigo y legibilidad

            Si hay algo bloqueante, empieza el comentario con "BLOQUEANTE:".
            Si el codigo esta limpio y listo, dilo explicitamente: "APROBADO - codigo limpio y optimo".
            Esto es solo informativo: nunca apruebes ni mergees el PR vos mismo, solo comenta.

            El PR ya esta clonado en el directorio actual.

                        Usa `gh pr comment` para dejar el comentario. No publiques el review como mensaje de chat, solo como comentario de GitHub.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
